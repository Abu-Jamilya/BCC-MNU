name: Generate submission report

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/submission-report.yml]

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      LLM_PROVIDER: ollama
      OLLAMA_MODEL: 'qwen3:4b'
      OLLAMA_HOST: '127.0.0.1:11434'
      OLLAMA_NUM_PARALLEL: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test
      - name: Install pinned Ollama runtime
        shell: bash
        run: |
          archive="$RUNNER_TEMP/ollama.tar.zst"
          curl --fail --silent --show-error --location --retry 3 \
            'https://github.com/ollama/ollama/releases/download/v0.40.18/ollama-linux-amd64.tar.zst' \
            --output "$archive"
          echo "b82649006cb5b54ed1237fa2d1a26a7f939a4fd03150033759acbff7ff315adf  $archive" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/ollama"
          tar --zstd -xf "$archive" -C "$RUNNER_TEMP/ollama"
          echo "$RUNNER_TEMP/ollama/bin" >> "$GITHUB_PATH"
      - name: Run the validator on the organizers' document
        shell: bash
        run: |
          ollama serve > "$RUNNER_TEMP/ollama.log" 2>&1 &
          for attempt in {1..30}; do
            if curl --silent --fail http://127.0.0.1:11434/api/version > /dev/null; then
              break
            fi
            sleep 1
          done
          ollama pull "$OLLAMA_MODEL"
          mkdir -p inputs
          curl --fail --silent --show-error --location --retry 3 \
            'https://raw.githubusercontent.com/BCC-HUB/ai-requirements-validator-task/928c1aa364265426105b69ba7a3444eac11b22db/docs/requirements.md' \
            --output inputs/requirements.md
          node validator.mjs --input inputs/requirements.md --output output/report.md
          cat output/report.md >> "$GITHUB_STEP_SUMMARY"
          awk '/^## Сводка$/{show=1} show{print "REPORT " $0}' output/report.md
      - name: Show Ollama diagnostics on failure
        if: failure()
        run: tail -n 45 "$RUNNER_TEMP/ollama.log"
      - uses: actions/upload-artifact@v4
        with:
          name: BCC-MNU-submission-report
          path: output/report.md
          if-no-files-found: error
          retention-days: 30
