name: Generate submission report

on:
  workflow_dispatch:
    inputs:
      provider:
        description: LLM provider
        type: choice
        required: true
        default: gemini
        options: [gemini, openai]

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Download the organizers' document
        run: |
          mkdir -p inputs
          curl --fail --silent --show-error --location --retry 3 \
            'https://raw.githubusercontent.com/BCC-HUB/ai-requirements-validator-task/928c1aa364265426105b69ba7a3444eac11b22db/docs/requirements.md' \
            --output inputs/requirements.md
      - name: Generate the report
        env:
          LLM_PROVIDER: ${{ inputs.provider }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          node validator.mjs --input inputs/requirements.md --output output/report.md
          cat output/report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: BCC-MNU-submission-report
          path: output/report.md
          if-no-files-found: error
          retention-days: 30
